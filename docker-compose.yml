# ──────────────────────────────────────────────────────
# Smart Assess Hub — Production Docker Compose
# ──────────────────────────────────────────────────────

services:
  # ─── MySQL Database ───
  db:
    image: mysql:8.0
    container_name: smartassesshub-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-trainingdb}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-sherni123}
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - smartassess-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-sherni123}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max-connections=200
      --innodb-buffer-pool-size=256M

  # ─── Spring Boot Application ───
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartassesshub-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Database
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/${MYSQL_DATABASE:-trainingdb}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-sherni123}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "false"
      # JWT Authentication
      JWT_SECRET: ${JWT_SECRET:-9a4f2c8d3e1b7a6f5c4d3b2a1e0f9b8a7c6d5e4f3a2b1c0e9d8c7b6a5f4e3d2c}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      # File uploads
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: 20MB
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: 20MB
      # Production logging
      LOGGING_LEVEL_ROOT: WARN
      LOGGING_LEVEL_COM_UNIV_SMARTASSESSHUB: INFO
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY: WARN
      # Spring profile
      SPRING_PROFILES_ACTIVE: prod
    volumes:
      - uploads-data:/app/uploads-dir
    networks:
      - smartassess-net

volumes:
  mysql-data:
    driver: local
  uploads-data:
    driver: local

networks:
  smartassess-net:
    driver: bridge
