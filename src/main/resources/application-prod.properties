# ──────────────────────────────────────────────────────
# Smart Assess Hub — Production Configuration
# Activated via SPRING_PROFILES_ACTIVE=prod
# ──────────────────────────────────────────────────────

# Database — overridden by Docker environment variables
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://db:3306/trainingdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:sherni123}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Connection pooling (HikariCP)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# File upload limits
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# JWT — overridden by Docker environment variables
jwt.secret=${JWT_SECRET:9a4f2c8d3e1b7a6f5c4d3b2a1e0f9b8a7c6d5e4f3a2b1c0e9d8c7b6a5f4e3d2c}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Production logging
logging.level.root=WARN
logging.level.com.univ.smartassesshub=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# Disable devtools in production
spring.devtools.restart.enabled=false

# Server configuration
server.port=8080
server.error.include-stacktrace=never
server.error.include-message=always
